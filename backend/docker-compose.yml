version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: freight_iq_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: freightiq_secure_password_2026
      POSTGRES_DB: freight_iq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freight_iq"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: freight_iq_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@freightiq.sail.gov.in
      PGADMIN_DEFAULT_PASSWORD: admin_freightiq_2026
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
